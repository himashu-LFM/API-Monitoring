name: Usage alerts

# Checks every service's usage against ALERT_THRESHOLDS and emails on a new
# crossing. Runs in GitHub's cloud, so alerts fire whether or not your laptop
# is on or the dashboard is open.
on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (UTC)
  workflow_dispatch: {} # lets you trigger a check by hand from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call the usage checker
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Not yet deployed is a normal state, not a failure. Exiting 1 here
          # made GitHub email "All jobs have failed" every 15 minutes (~96/day)
          # for as long as the app was unpublished. Skip quietly instead; the
          # check starts working by itself the moment MONITOR_URL is added.
          if [ -z "$MONITOR_URL" ]; then
            echo "::notice::MONITOR_URL secret not set — skipping. Add it (e.g. https://your-app.vercel.app) once deployed."
            exit 0
          fi

          # Same reasoning: without the shared secret the endpoint can only
          # answer 401, so every run would "fail" for a setup reason.
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET secret not set — skipping. It must match CRON_SECRET in the deployed app's env."
            exit 0
          fi

          response=$(curl -sS --max-time 60 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$MONITOR_URL/api/cron/check")

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "Checker failed"
            exit 1
          fi
