# Netlify build config.
#
# The Next.js runtime is auto-installed by Netlify, so no plugin entry is
# needed. Node 20 is pinned because the build tooling and @netlify/blobs both
# expect a modern runtime and Netlify's default has moved before.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Netlify's secrets scanner checks every env var's value against the repo
  # and build output. These are plain config (dates, numbers, enums, an org
  # id), not secrets, and their short values collide with ordinary text —
  # e.g. a renewal date matching a date in a code comment — failing the build.
  # Real secrets (API keys, tokens, passwords) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "ZYTE_ORG_ID,ZYTE_RENEWAL,ZYTE_LIMIT,ZYTE_BILLING_CYCLE,DECODO_RENEWAL,DECODO_BILLING_CYCLE,DECODO_PROXY_TYPE,DECODO_TRAFFIC_FIELD,GOOGLE_LIMIT,ALERT_THRESHOLDS,SADCAPTCHA_TOTAL_CREDITS"
